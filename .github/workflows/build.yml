name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Find changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: packages
        uses: ./.github/actions/changed-packages
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          rebuild-all-pattern: '^(\.copr/|\.github/workflows/build\.yml$)'

  srpm:
    name: SRPM (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - run: dnf -y install git make rpm-build redhat-rpm-config

      - uses: actions/checkout@v7

      - working-directory: ${{ matrix.package }}
        run: >-
          make -f "$GITHUB_WORKSPACE/.copr/Makefile" srpm
          outdir="$RUNNER_TEMP/srpm"
          spec="$GITHUB_WORKSPACE/${{ matrix.package }}/${{ matrix.package }}.spec"

      - uses: actions/upload-artifact@v7
        with:
          name: srpm-${{ matrix.package }}
          path: ${{ runner.temp }}/srpm/*.src.rpm

  rpm:
    name: RPM (${{ matrix.package }}, ${{ matrix.chroot.name }})
    needs: [changes, srpm]
    runs-on: ubuntu-latest
    # Build with mock, like Copr does. Mock needs to create mounts and
    # namespaces for its chroot, hence the privileged container.
    container:
      image: registry.fedoraproject.org/fedora:44
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        # Keep in sync with the chroots enabled in the hasali19/selene Copr
        # project. Copr builds EL10 in rhel+epel-10, which needs a Red Hat
        # subscription; alma+epel-10 is the closest freely available match.
        chroot:
          - name: fedora-44
            config: fedora-44-x86_64
          - name: fedora-45
            config: fedora-45-x86_64
          - name: epel-10
            config: alma+epel-10-x86_64
            repos: https://repo.almalinux.org/almalinux/10/devel/$basearch/os/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: srpm-${{ matrix.package }}
          path: srpm

      - run: dnf -y install mock

      - env:
          CONFIG: ${{ matrix.chroot.config }}
          REPOS: ${{ matrix.chroot.repos }}
        shell: bash
        run: |
          args=()
          for repo in $REPOS; do args+=(--addrepo "$repo"); done
          mock -r "$CONFIG" "${args[@]}" --resultdir rpms --rebuild srpm/*.src.rpm

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpms-${{ matrix.package }}-${{ matrix.chroot.name }}
          path: rpms/

  result:
    name: Build result
    needs: [changes, srpm, rpm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
